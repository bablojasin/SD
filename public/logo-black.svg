          <!-- Loop with Stencil Notch -->
          <path d="M 18,0 L 46,0 L 60,14 L 60,26 L 46,38 L 18,38 L 18,26 L 44,26 L 48,22 L 48,16 L 44,12 L 18,12 Z" fill="#050807" />
