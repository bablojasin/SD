          <polygon points="18,29 48,29 48,41 18,41" fill="#050807" />
          <!-- Bottom Horizontal Arm (White) -->
          <polygon points="18,58 48,58 58,58 58,70 18,70" fill="#050807" />
        </g>

        <!-- Letter 4: C (Width: 62, Height: 70, Origin: X=346) -->
        <g transform="translate(346, 0)">
          <path d="M 14,0 L 62,0 L 62,12 L 50,12 L 16,12 L 12,16 L 12,54 L 16,58 L 50,58 L 62,58 L 62,70 L 14,70 L 0,56 L 0,14 Z" fill="#050807" />
        </g>

        <!-- Letter 5: T (Width: 72, Height: 70, Origin: X=424) -->
        <g transform="translate(424, 0)">
          <path d="M 0,0 L 72,0 L 72,12 L 60,12 L 43,18 L 43,70 L 29,70 L 29,18 L 12,12 L 0,12 Z" fill="#050807" />
