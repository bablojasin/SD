          <!-- Middle Horizontal Arm (White) -->
          <polygon points="18,29 48,29 48,41 18,41" fill="#050807" />
          <!-- Bottom Horizontal Arm (White) -->
          <polygon points="18,58 48,58 58,58 58,70 18,70" fill="#050807" />
        </g>
