        <!-- D (X=0) -->
        <path d="M 0,0 L 26,0 C 38,0 44,6 44,13 C 44,20 38,26 26,26 L 0,26 Z M 8.5,7.5 L 8.5,18.5 L 24,18.5 C 29,18.5 34,16.5 34,13 C 34,9.5 29,7.5 24,7.5 Z" fill="#050807" />

