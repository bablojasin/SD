          <path d="M 16,0 L 52,0 L 66,14 L 66,24 L 52,24 L 52,12 L 18,12 L 13,17 L 13,24 L 20,30 L 66,38 L 66,42 L 0,42 L 0,38 L 48,30 L 12,24 L 0,16 L 0,14 Z" fill="#050807" />
