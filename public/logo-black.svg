        </g>

        <!-- Letter 2: P (Width: 60, Height: 70, Origin: X=196) -->
        <g transform="translate(196, 0)">
          <!-- Vertical Stem -->
          <polygon points="0,0 14,0 14,70 0,70" fill="#050807" />
          <!-- Loop with Stencil Notch -->
          <path d="M 18,0 L 46,0 L 60,14 L 60,28 L 46,42 L 18,42 L 18,30 L 44,30 L 48,26 L 48,16 L 44,12 L 18,12 Z" fill="#050807" />
        </g>

