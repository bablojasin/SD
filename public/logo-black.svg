        <path d="M 330,0 L 339,0 L 364,18.5 L 364,0 L 372,0 L 372,26 L 363,26 L 338,7.5 L 338,26 L 330,26 Z" fill="#050807" />

        <!-- D (X=422) -->
        <path d="M 422,0 L 448,0 C 460,0 466,6 466,13 C 466,20 460,26 448,26 L 422,26 Z M 430.5,7.5 L 430.5,18.5 L 446,18.5 C 451,18.5 456,16.5 456,13 C 456,9.5 451,7.5 446,7.5 Z" fill="#050807" />
