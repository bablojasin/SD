name: Deploy SPECTRE DEFEND to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Static Production Distribution
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/404.html || exit 1
          test -f dist/CNAME || exit 1
          grep -qx "SpectreDefend.dpdns.org" dist/CNAME || (echo "CNAME mismatch!" && exit 1)
          test -f dist/admin/index.html || exit 1
          test -f dist/admin/config.yml || exit 1
          test -f dist/robots.txt || exit 1
          test -f dist/sitemap.xml || exit 1
          echo "All critical production assets including CNAME verified successfully."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
